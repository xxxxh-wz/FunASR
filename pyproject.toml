[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funasr"
version = "1.3.9"
description = "Industrial-grade speech recognition: 170x realtime, 50+ languages, speaker diarization, emotion detection."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Speech Lab of Alibaba Group", email = "funasr@list.alibaba-inc.com" },
]
keywords = [
    "speech-recognition",
    "asr",
    "speaker-diarization",
    "vad",
    "pytorch",
    "whisper-alternative",
    "multilingual",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "scipy>=1.4.1",
    "librosa",
    "soundfile>=0.12.1",
    "numpy",
    "PyYAML>=5.1.2",
    "tqdm",
    "requests",
    "omegaconf>=2.0",
    "hydra-core>=1.3.2",
    "modelscope",
    "huggingface_hub",
    "safetensors",
    "transformers",
    "tiktoken",
    "sentencepiece",
    "kaldiio>=2.17.0",
    "jieba",
    "jamo",
    "jaconv",
    "umap_learn",
    "editdistance>=0.5.2",
    "torch_complex",
    "tensorboardX",
    "oss2",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "rich",
    "httpx",
    "qwen-asr[vllm]==0.0.6",
    "vllm==0.14.0",
]

[project.urls]
Homepage = "https://github.com/modelscope/FunASR"
Documentation = "https://modelscope.github.io/FunASR/"
"Bug Tracker" = "https://github.com/modelscope/FunASR/issues"

[project.scripts]
funasr = "funasr.cli:main"
batch-transcribe = "batch_transcriber.cli:main"
batch-transcribe-download-models = "batch_transcriber.download_models:main"
funasr-hydra = "funasr.bin.inference:main_hydra"
funasr-server = "funasr.bin.server:main"
funasr-train = "funasr.bin.train:main_hydra"
funasr-train-ds = "funasr.bin.train_ds:main_hydra"
funasr-export = "funasr.bin.export:main_hydra"
scp2jsonl = "funasr.datasets.audio_datasets.scp2jsonl:main_hydra"
jsonl2scp = "funasr.datasets.audio_datasets.jsonl2scp:main_hydra"
sensevoice2jsonl = "funasr.datasets.audio_datasets.sensevoice2jsonl:main_hydra"
funasr-scp2jsonl = "funasr.datasets.audio_datasets.scp2jsonl:main_hydra"
funasr-jsonl2scp = "funasr.datasets.audio_datasets.jsonl2scp:main_hydra"
funasr-sensevoice2jsonl = "funasr.datasets.audio_datasets.sensevoice2jsonl:main_hydra"

[project.optional-dependencies]
train = [
    "editdistance",
]
all = [
    "torch_optimizer",
    "fairscale",
    "transformers",
    "openai-whisper",
    "editdistance",
    "transformers>=4.32.0",
    "accelerate",
    "tiktoken",
    "einops",
    "transformers_stream_generator>=0.0.4",
    "scipy",
    "torchvision",
    "pillow",
    "matplotlib",
]
test = [
    "pytest>=3.3.0",
    "pytest-timeouts>=1.2.1",
    "pytest-pythonpath>=0.7.3",
    "pytest-cov>=2.7.1",
    "hacking>=2.0.0",
    "mock>=2.0.0",
    "pycodestyle",
    "jsondiff<2.0.0,>=1.2.0",
    "flake8>=3.7.8",
    "flake8-docstrings>=1.3.1",
    "black",
    "editdistance",
]
doc = [
    "Jinja2",
    "Sphinx",
    "sphinx-rtd-theme>=0.2.4",
    "sphinx-argparse>=0.2.5",
    "commonmark",
    "recommonmark>=0.4.0",
    "nbsphinx>=0.4.2",
    "sphinx-markdown-tables>=0.0.12",
    "configargparse>=1.2.1",
]
llm = [
    "transformers>=4.32.0",
    "accelerate",
    "tiktoken",
    "einops",
    "transformers_stream_generator>=0.0.4",
    "scipy",
    "torchvision",
    "pillow",
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["funasr*", "batch_transcriber*"]

[tool.setuptools.package-data]
funasr = ["version.txt"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
